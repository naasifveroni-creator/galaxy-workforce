<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Workforce</title>
    <style>
        body { margin: 0; padding: 0; background: #05050a; color: #fff; display: flex; height: 100vh; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        #game-container { flex: 1; display: flex; justify-content: center; align-items: center; }
        #hud { width: 320px; background: #0d111a; border-left: 2px solid #1a2035; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        h2, h3 { margin: 0 0 10px 0; font-size: 16px; color: #4da6ff; text-transform: uppercase; }
        button { background: #131b2e; color: #a9b7d0; border: 1px solid #2a3b5c; padding: 12px; border-radius: 4px; cursor: pointer; text-align: left; transition: all 0.2s; font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        button:hover { background: #1c2942; border-color: #4da6ff; color: #fff; }
        .action-btn { padding: 8px; border-radius: 3px; cursor: pointer; font-weight: bold; border: none; color: white; }
        .approve { background: #2ecc71; }
        .reject { background: #e74c3c; }
        .approval-card { background: #151a22; border: 1px solid #f1c40f; padding: 15px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
    </style>
    <!-- Load Phaser from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="hud">
        <div>
            <h2>Commander HUD</h2>
            <div id="connection-status" style="font-size: 12px; color: #f1c40f;">connecting...</div>
        </div>
        <div>
            <h3>Dispatch</h3>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="sendDispatch('email_bot')">▶ Run EmailBot</button>
                <button onclick="sendDispatch('data_bot')">▶ Run DataBot</button>
                <button onclick="sendDispatch('excel_bot')">▶ Run ExcelBot</button>
                <button onclick="sendDispatch('report_bot')">▶ Run ReportBot</button>
            </div>
        </div>
        <div style="flex: 1; overflow-y: auto;">
            <h3>Approvals</h3>
            <div id="approval-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <!-- ALL the logic is here so it loads AFTER the buttons exist -->
    <script>
        const WS_URL = "wss://orange-system-g4w4gq7r9gxxcw7q-8000.app.github.dev/ws";
        let ws;
        let gameScene;
        let bots = {};

        const ROOMS = {
            bridge: { x: 400, y: 500, label: "Bridge (HQ)", color: 0x1e293b },
            comms_array: { x: 150, y: 150, label: "Comms Array", color: 0x451a1a },
            data_forge: { x: 650, y: 150, label: "Data Forge", color: 0x0f3a4d },
            strategy_deck: { x: 150, y: 450, label: "Strategy Deck", color: 0x1a3d1a }
        };

        // 1. SET UP PHASER
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: '#0a0a0a',
            scene: { create: create }
        };

        function create() {
            gameScene = this; // Save the scene so we can use tweens later

            // Draw Rooms
            for (const [key, room] of Object.entries(ROOMS)) {
                this.add.rectangle(room.x, room.y, 250, 200, room.color, 0.5).setStrokeStyle(2, 0x555555);
                this.add.text(room.x - 110, room.y - 90, room.label, { fontFamily: 'monospace', fontSize: '14px', color: '#fff' });
            }
            
            // Connect WebSocket
            connectWebSocket();
        }

        new Phaser.Game(config);

        // 2. WEBSOCKET LOGIC
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.getElementById('connection-status').innerHTML = '🟢 connected';
                document.getElementById('connection-status').style.color = '#2ecc71';
            };

            ws.onclose = () => {
                document.getElementById('connection-status').innerHTML = '🔴 disconnected';
                document.getElementById('connection-status').style.color = '#e74c3c';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'SNAPSHOT') {
                    data.bots.forEach(botData => updateBot(botData));
                } else if (data.type === 'BOT_STATUS') {
                    updateBot(data);
                } else if (data.type === 'APPROVAL_REQUEST') {
                    showApprovalCard(data);
                }
            };
        }

        // 3. BOT MOVEMENT LOGIC
        function updateBot(data) {
            let bot = bots[data.bot_id];
            const room = ROOMS[data.location] || ROOMS.bridge;
            
            // Calculate offset so bots don't stack
            const offset = data.bot_id === 'email_bot' ? -40 : data.bot_id === 'data_bot' ? -15 : data.bot_id === 'excel_bot' ? 15 : 40;
            const targetX = room.x + offset;
            const targetY = room.y + 20; // slightly lower so they don't cover the room text

            // Create the bot if it doesn't exist
            if (!bot) {
                const circle = gameScene.add.circle(targetX, targetY, 15, data.color).setStrokeStyle(2, 0xffffff);
                const label = gameScene.add.text(targetX, targetY - 30, data.name, { fontFamily: 'monospace', fontSize: '12px', color: '#fff' }).setOrigin(0.5);
                const statusLabel = gameScene.add.text(targetX, targetY + 25, data.status.replace('_', ' '), { fontFamily: 'monospace', fontSize: '10px', color: '#aaa' }).setOrigin(0.5);
                
                bot = { sprite: circle, label: label, status: statusLabel };
                bots[data.bot_id] = bot;
            }

            // Update text
            bot.status.setText(data.status.replace('_', ' '));

            // Move the bot if it needs to move
            if (bot.sprite.x !== targetX || bot.sprite.y !== targetY) {
                gameScene.tweens.add({
                    targets: [bot.sprite, bot.label, bot.status],
                    x: targetX,
                    y: function(target) {
                        if (target === bot.label) return targetY - 30;
                        if (target === bot.status) return targetY + 25;
                        return targetY;
                    },
                    duration: 2000, // 2 seconds to walk
                    ease: 'Linear'
                });
            }
        }

        // 4. HUD LOGIC
        function showApprovalCard(data) {
            const container = document.getElementById('approval-container');
            const card = document.createElement('div');
            card.className = 'approval-card';
            card.id = `card-${data.bot_id}`;
            card.innerHTML = `
                <div style="font-weight:bold; color:#4da6ff; margin-bottom:5px;">${data.bot_id}</div>
                <div style="margin-bottom:10px;">${data.summary}</div>
                <div style="display:flex; gap:10px;">
                    <button class="action-btn approve" onclick="sendApproval('${data.bot_id}', true)">APPROVE</button>
                    <button class="action-btn reject" onclick="sendApproval('${data.bot_id}', false)">REJECT</button>
                </div>
            `;
            container.appendChild(card);
        }

        function sendDispatch(botId) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'DISPATCH', bot_id: botId }));
            }
        }

        function sendApproval(botId, isApproved) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'APPROVE_ACTION', bot_id: botId, approved: isApproved }));
                const card = document.getElementById(`card-${botId}`);
                if (card) card.remove();
            }
        }
    </script>
</body>
</html>
