<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Workforce</title>
    <style>
        body { margin: 0; padding: 0; background: #05050a; color: #fff; display: flex; height: 100vh; overflow: hidden; font-family: monospace; }
        #game-container { flex: 1; display: flex; justify-content: center; align-items: center; }
        #hud { width: 300px; background: #0d111a; border-left: 1px solid #222; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        h2, h3 { margin: 0 0 10px 0; font-size: 16px; color: #eee; }
        button { background: #1a2035; color: #fff; border: 1px solid #334; padding: 10px; border-radius: 5px; cursor: pointer; text-align: left; transition: 0.2s; }
        button:hover { background: #2a3050; }
        .approval-card { background: #1a1a24; border: 1px solid #f1c40f; padding: 15px; border-radius: 5px; margin-bottom: 10px; font-size: 12px; }
    </style>
    <!-- Load Phaser from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Load our config and game logic -->
    <script src="config.js"></script>
    <script src="main.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="hud">
        <div>
            <h2>Commander HUD</h2>
            <div id="connection-status" style="font-size: 12px; color: #f1c40f;">connecting...</div>
        </div>

        <div>
            <h3>Dispatch</h3>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="sendDispatch('email_bot')">▶ Run EmailBot</button>
                <button onclick="sendDispatch('data_bot')">▶ Run DataBot</button>
                <button onclick="sendDispatch('excel_bot')">▶ Run ExcelBot</button>
                <button onclick="sendDispatch('report_bot')">▶ Run ReportBot</button>
            </div>
        </div>

        <div>
            <h3>Approvals</h3>
            <div id="approval-container" style="display: flex; flex-direction: column; overflow-y: auto; max-height: 50vh;">
                <!-- Approval cards will appear here -->
            </div>
        </div>
    </div>

</body>
</html>
