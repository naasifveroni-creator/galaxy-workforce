<!DOCTYPE html>
<html>
<head>
    <title>Galaxy Test</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: monospace; display: flex; height: 100vh; margin: 0; }
        #hud { width: 300px; border-right: 1px solid #333; padding: 20px; }
        button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; background: #1a2035; color: white; border: 1px solid #4da6ff; cursor: pointer; }
        #log { flex: 1; padding: 20px; background: #000; color: #0f0; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="hud">
        <h2>Commander HUD</h2>
        <p id="status" style="color: yellow;">Connecting...</p>
        <button onclick="sendDispatch('data_bot')">Run DataBot</button>
        <button onclick="sendDispatch('excel_bot')">Run ExcelBot</button>
    </div>
    <div id="log">Waiting for logs...</div>

    <script>
        // We are hardcoding the URL just to test the connection
        const test_ws = new WebSocket("wss://orange-system-g4w4gq7r9gxxcw7q-8000.app.github.dev/ws");

        test_ws.onopen = () => {
            document.getElementById('status').innerText = "🟢 CONNECTED";
            document.getElementById('status').style.color = "#2ecc71";
        };
        
        test_ws.onclose = () => {
            document.getElementById('status').innerText = "🔴 DISCONNECTED";
            document.getElementById('status').style.color = "#e74c3c";
        };

        test_ws.onmessage = (event) => {
            document.getElementById('log').innerHTML += "<br>> " + event.data;
        };

        function sendDispatch(botId) {
            document.getElementById('log').innerHTML += "<br>> Button clicked for " + botId;
            if (test_ws.readyState === WebSocket.OPEN) {
                test_ws.send(JSON.stringify({ type: 'DISPATCH', bot_id: botId }));
            } else {
                document.getElementById('log').innerHTML += " (WebSocket not open!)";
            }
        }
    </script>
</body>
</html>
