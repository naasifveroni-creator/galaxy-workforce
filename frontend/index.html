<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Workforce</title>
    <style>
        body { margin: 0; padding: 0; background: #05050a; color: #fff; display: flex; height: 100vh; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        #game-container { flex: 1; display: flex; justify-content: center; align-items: center; }
        #hud { width: 320px; background: #0d111a; border-left: 2px solid #1a2035; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        h2, h3 { margin: 0 0 10px 0; font-size: 16px; color: #4da6ff; text-transform: uppercase; }
        button { background: #131b2e; color: #a9b7d0; border: 1px solid #2a3b5c; padding: 12px; border-radius: 4px; cursor: pointer; text-align: left; transition: all 0.2s; font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        button:hover { background: #1c2942; border-color: #4da6ff; color: #fff; }
        .action-btn { padding: 8px; border-radius: 3px; cursor: pointer; font-weight: bold; border: none; color: white; }
        .approve { background: #2ecc71; }
        .reject { background: #e74c3c; }
        .approval-card { background: #151a22; border: 1px solid #f1c40f; padding: 15px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
    </style>
    <!-- Load Phaser from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="hud">
        <div>
            <h2>Commander HUD</h2>
            <div id="connection-status" style="font-size: 12px; color: #f1c40f;">connecting...</div>
        </div>
        <div>
            <h3>Dispatch</h3>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="sendDispatch('email_bot')">▶ Run EmailBot</button>
                <button onclick="sendDispatch('data_bot')">▶ Run DataBot</button>
                <button onclick="sendDispatch('excel_bot')">▶ Run ExcelBot</button>
                <button onclick="sendDispatch('report_bot')">▶ Run ReportBot</button>
            </div>
        </div>
        <div style="flex: 1; overflow-y: auto;">
            <h3>Approvals</h3>
            <div id="approval-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <!-- EVERYTHING IS DEFINED RIGHT HERE -->
    <script>
        const WS_URL = "wss://orange-system-g4w4gq7r9gxxcw7q-8000.app.github.dev/ws";
        let ws;
        let gameScene;
        let bots = {};

        const TILE = 80;
        const ROOMS = {
            bridge:        { label: "Bridge (HQ)",     col: 5, row: 4, w: 3, h: 2, color: 0x1e293b },
            comms_array:   { label: "Comms Array",     col: 0, row: 0, w: 4, h: 3, color: 0x451a1a },
            data_forge:    { label: "Data Forge",      col: 8, row: 0, w: 4, h: 3, color: 0x0f3a4d },
            strategy_deck: { label: "Strategy Deck",   col: 0, row: 5, w: 4, h: 3, color: 0x1a3d1a }
        };
        const BOT_OFFSETS = { email_bot: [-40, 0], data_bot: [-10, 0], excel_bot: [20, 0], report_bot: [50, 0] };

        function create() {
            gameScene = this;

            // Draw Grid
            const graphics = this.add.graphics();
            graphics.lineStyle(1, 0x333333, 1);
            for (let x = 0; x <= 1200; x += TILE) graphics.lineBetween(x, 0, x, 800);
            for (let y = 0; y <= 800; y += TILE) graphics.lineBetween(0, y, 1200, y);

            // Draw Rooms
            for (const [key, room] of Object.entries(ROOMS)) {
                const x = room.col * TILE;
                const y = room.row * TILE;
                const w = room.w * TILE;
                const h = room.h * TILE;
                this.add.rectangle(x, y, w, h, room.color, 0.6).setOrigin(0, 0).setStrokeStyle(2, 0x555555);
                this.add.text(x + 10, y + 10, room.label, { fontFamily: 'monospace', fontSize: '14px', color: '#ffffff' });
            }

            connectWebSocket.call(this);
        }

        const config = {
            type: Phaser.AUTO,
            width: 1100,
            height: 700,
            parent: 'game-container',
            backgroundColor: '#0a0a0a',
            scene: { create: create }
        };
        new Phaser.Game(config);

        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.getElementById('connection-status').innerHTML = '🟢 connected';
                document.getElementById('connection-status').style.color = '#2ecc71';
            };

            ws.onclose = () => {
                document.getElementById('connection-status').innerHTML = '🔴 disconnected';
                document.getElementById('connection-status').style.color = '#e74c3c';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'SNAPSHOT') {
                    data.bots.forEach(botData => applyBotStatus.call(this, botData));
                } else if (data.type === 'BOT_STATUS') {
                    applyBotStatus.call(this, data);
                } else if (data.type === 'APPROVAL_REQUEST') {
                    showApprovalCard(data);
                }
            };
        }

        function applyBotStatus(data) {
            let bot = bots[data.bot_id];
            const targetRoom = ROOMS[data.location] || ROOMS['bridge'];
            const offset = BOT_OFFSETS[data.bot_id] || [0, 0];

            const targetX = (targetRoom.col * TILE) + (targetRoom.w * TILE / 2) + offset[0];
            const targetY = (targetRoom.row * TILE) + (targetRoom.h * TILE / 2) + offset[1];

            if (!bot) {
                const circle = this.add.circle(targetX, targetY, 15, data.color).setStrokeStyle(2, 0xffffff);
                const label = this.add.text(targetX, targetY - 25, data.name, { fontFamily: 'monospace', fontSize: '12px', color: '#ffffff' }).setOrigin(0.5);
                const statusLabel = this.add.text(targetX, targetY + 25, data.status.replace('_', ' '), { fontFamily: 'monospace', fontSize: '10px', color: '#aaaaaa' }).setOrigin(0.5);
                bot = { sprite: circle, label: label, statusLabel: statusLabel };
                bots[data.bot_id] = bot;
            }

            bot.statusLabel.setText(data.status.replace('_', ' '));

            const currentTargetX = bot.sprite.getData('targetX');
            const currentTargetY = bot.sprite.getData('targetY');

            if (currentTargetX !== targetX || currentTargetY !== targetY) {
                bot.sprite.setData('targetX', targetX);
                bot.sprite.setData('targetY', targetY);
                this.tweens.killTweensOf([bot.sprite, bot.label, bot.statusLabel]);
                this.tweens.add({
                    targets: [bot.sprite, bot.label, bot.statusLabel],
                    x: targetX,
                    y: (target) => {
                        if (target === bot.label) return targetY - 25;
                        if (target === bot.statusLabel) return targetY + 25;
                        return targetY;
                    },
                    duration: 2000,
                    ease: 'Linear'
                });
            }

            if (data.status === 'working' || data.status === 'waiting_approval' || data.status === 'executing') {
                if (!bot.pulseTween) {
                    bot.pulseTween = this.tweens.add({ targets: bot.sprite, scale: 1.3, duration: 500, yoyo: true, repeat: -1 });
                }
            } else {
                if (bot.pulseTween) {
                    bot.pulseTween.stop();
                    bot.pulseTween = null;
                    bot.sprite.setScale(1);
                }
            }
        }

        function showApprovalCard(data) {
            const container = document.getElementById('approval-container');
            let previewText = data.preview ? JSON.stringify(data.preview, null, 2) : "";
            const card = document.createElement('div');
            card.className = 'approval-card';
            card.id = `card-${data.bot_id}`;
            card.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 5px; color: #4da6ff;">${data.bot_id}</div>
                <div style="margin-bottom: 10px;">${data.summary}</div>
                <pre style="background: #000; padding: 10px; border-radius: 4px; font-size: 10px; max-height: 150px; overflow-y: auto;">${previewText}</pre>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="sendApproval('${data.bot_id}', true)" class="action-btn approve" style="flex: 1;">APPROVE</button>
                    <button onclick="sendApproval('${data.bot_id}', false)" class="action-btn reject" style="flex: 1;">REJECT</button>
                </div>
            `;
            container.appendChild(card);
        }

        function sendApproval(botId, isApproved) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'APPROVE_ACTION', bot_id: botId, approved: isApproved }));
                const card = document.getElementById(`card-${botId}`);
                if (card) card.remove();
            }
        }

        function sendDispatch(botId) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'DISPATCH', bot_id: botId }));
            }
        }
    </script>
</body>
</html>
